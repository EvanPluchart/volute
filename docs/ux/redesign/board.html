<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: Figtree; src: url("../../../site/assets/fonts/figtree.woff2"); font-weight: 400 800; }
  body { margin: 0; background: #131018; color: #F4EDE3; font-family: Figtree, sans-serif; padding: 56px; }
  h1 { font-size: 44px; margin: 0 0 8px; letter-spacing: -0.03em; }
  p.sub { color: #A89FB4; font-size: 19px; margin: 0 0 44px; }
  .row { display: flex; gap: 40px; align-items: flex-start; margin-bottom: 56px; }
  figure { margin: 0; }
  figcaption { color: #A89FB4; font-size: 16px; margin-top: 12px; }
  .tag { display: inline-block; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 4px 10px; border-radius: 6px; margin-bottom: 14px; }
  .before { background: #2B2534; color: #A89FB4; }
  .after { background: #FFB020; color: #1B1530; }
  img { border-radius: 10px; display: block; }
</style></head>
<body>
  <h1>Volute — avant et après la refonte</h1>
  <p class="sub">Même démo (--mock). À gauche M1, à droite le 25 octobre : surfaces neutres au repos, le niveau en ambre dans le remplissage, le violet seulement pour Volute qui parle.</p>
  <div class="row">
    <figure><span class="tag before">Avant</span><img src="before-flyout-dark.png" width="360"><figcaption>Bandeau violet saturé, faders violets au repos, pastilles d'initiales.</figcaption></figure>
    <figure><span class="tag after">Après</span><img src="after-flyout-dark.png" width="360"><figcaption>Calme au repos, le son en ambre, une vraie hiérarchie.</figcaption></figure>
    <figure><span class="tag after">Après, clair</span><img src="after-flyout-light.png" width="360"><figcaption>Le même en thème clair.</figcaption></figure>
  </div>
  <div class="row">
    <figure><span class="tag before">Avant</span><img src="before-main-dark.png" width="420"><figcaption>Onglets en pilule, texte minuscule, « À propos » dans une autre fenêtre.</figcaption></figure>
    <figure><span class="tag after">Après</span><img src="after-main-light.png" width="585"><figcaption>Un rail, quatre vues, la sortie principale comme un instrument.</figcaption></figure>
    <figure><span class="tag after">Nouveau</span><img src="after-settings-dark.png" width="585"><figcaption>Réglages : thème, démarrage, fermeture, mises à jour.</figcaption></figure>
  </div>
</body></html>
