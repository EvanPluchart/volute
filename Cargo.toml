[workspace]
resolver = "3"
members = ["crates/volute-audio", "crates/volute-core", "crates/volute-shell", "crates/volute-app", "xtask"]

[workspace.package]
version = "0.0.1"
edition = "2024"
# let-chains (`if let … && let …`) need 1.88.
rust-version = "1.88"
license = "MIT"
authors = ["Evan Pluchart"]
repository = "https://github.com/EvanPluchart/volute"

[workspace.dependencies]
volute-audio = { path = "crates/volute-audio" }
volute-core = { path = "crates/volute-core" }
volute-shell = { path = "crates/volute-shell" }

# Slint is pinned to an exact version, Vigie's, and upgraded only on purpose (decision 0001).
# Software renderer on winit: the idle memory budget (docs/ARCHITECTURE.md).
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "accessibility", "unstable-winit-030"] }
slint-build = "=1.18.1"
# Core Audio (decision 0002), in volute-audio only.
windows = "=0.62.2"
# COM callbacks (`implement`), in volute-audio only; the version windows 0.62.2 uses.
windows-core = "=0.62.2"
# Plain Win32 for the desktop (tray, single instance), in volute-shell only.
windows-sys = "=0.61.2"
# The application icon and version information in the executable (build only).
winresource = "=0.1.34"
flume = "=0.12.0"
anyhow = "=1.0.104"
thiserror = "=2.0.21"

# Smaller code touches fewer pages: part of the memory budget (docs/ARCHITECTURE.md).
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
